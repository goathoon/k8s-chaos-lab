apiVersion: apps/v1
kind: Deployment
metadata:
  name: direct-memory-lab
  namespace: chaos-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: direct-memory-lab
  template:
    metadata:
      labels:
        app: direct-memory-lab
    spec:
      containers:
      - name: app
        image: direct-memory-lab:local
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "8080"
        - name: DIRECT_TARGET_MB
          value: "64"
        - name: DIRECT_CHUNK_MB
          value: "4"
        - name: ALLOC_SLEEP_MS
          value: "50"
        ports:
        - containerPort: 8080
        command: ["java"]
        args:
        - "-Xms256m"
        - "-Xmx256m"
        - "-XX:+ExitOnOutOfMemoryError"
        - "-jar"
        - "/opt/app/app.jar"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
