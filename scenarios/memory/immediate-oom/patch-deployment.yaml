apiVersion: apps/v1
kind: Deployment
metadata:
  name: direct-memory-lab
  namespace: chaos-lab
spec:
  template:
    spec:
      containers:
      - name: app
        env:
        - name: PORT
          value: "8080"
        - name: DIRECT_TARGET_MB
          value: "768"
        - name: DIRECT_CHUNK_MB
          value: "64"
        - name: ALLOC_SLEEP_MS
          value: "0"
        args:
        - "-Xms128m"
        - "-Xmx128m"
        - "-XX:MaxDirectMemorySize=512m"
        - "-XX:+ExitOnOutOfMemoryError"
        - "-jar"
        - "/opt/app/app.jar"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "192Mi"
            cpu: "500m"
